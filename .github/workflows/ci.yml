name: deploy-book

on:
  push:
    branches:
    - main
  # Build (but do not publish) on PRs and on the restructure branch, so a broken
  # book is caught before it reaches the branch that publishes.
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Install from requirements.txt, not a bare `jupyter-book`. The book now
    # declares `sphinxext.rediraffe` in docs/_config.yml (it emits the redirect
    # stubs for the ~19 chapters moved during the three-tier restructure), and a
    # toolchain without it fails the build outright with
    #   Could not import extension sphinxext.rediraffe
    # Installing only jupyter-book would take the published site down.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # -W turns Sphinx warnings into errors: a broken cross-reference or a
    # redirect pointing at a page that no longer exists should fail the build
    # rather than silently ship. The book is currently warning-clean.
    - name: Build the book
      run: jupyter-book build docs --warningiserror

    - name: GitHub Pages action
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        publish_branch: book
        enable_jekyll: false
