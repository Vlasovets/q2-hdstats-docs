name: deploy-book

on:
  # Build on PRs and on the restructure branch too, so a broken book is caught
  # before it reaches the branch that publishes. Only `main` deploys -- the
  # deploy job is gated on the ref, not on this list.
  push:
    branches:
    - main
    - tutorial-restructure
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref, so a PR build supersedes its own predecessor and can never evict
# a queued deploy of main. The production lock lives on the deploy job, where it
# belongs -- a workflow-level `pages` group would let a PR push cancel a pending
# main deployment, which shows up as "cancelled" rather than failed and would
# leave the site quietly stale. That is the failure mode this file exists to end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Install from requirements.txt, not a bare `jupyter-book`. The book declares
    # `sphinxext.rediraffe` in docs/_config.yml (it emits the redirect stubs for
    # the ~19 chapters moved during the three-tier restructure), and a toolchain
    # without it fails the build outright with
    #   Could not import extension sphinxext.rediraffe
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # -W turns Sphinx warnings into errors: a broken cross-reference or a
    # redirect pointing at a page that no longer exists should fail the build
    # rather than silently ship. The book is currently warning-clean.
    - name: Build the book
      run: jupyter-book build docs --warningiserror

    - name: Sanity-check the built tree
      run: |
        set -euo pipefail
        for f in \
          docs/_build/html/index.html \
          docs/_build/html/chapters/02_lowdim_gglasso/01_data_preparation.html \
          docs/_build/html/chapters/04_highdim_atacama/01_data.html \
          docs/_build/html/chapters/90_reference/01_command_coverage.html
        do
          [[ -s "$f" ]] || { echo "missing or empty: $f"; exit 1; }
        done
        echo "built $(find docs/_build/html -name '*.html' | wc -l) html pages"

    # Stamp the artifact so the post-deploy check can prove THIS build is live.
    # Probing for pages that exist in every post-restructure build only ever
    # distinguishes the stale July site; once past that it would pass
    # unconditionally, including on a deploy that errored and left the CDN
    # serving an older artifact. Content comparison cannot be satisfied by an
    # older build. Plain filename, not a dotfile: upload-pages-artifact drops
    # hidden files.
    - name: Stamp the build
      run: printf '%s %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > docs/_build/html/build-id.txt

    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Serialise production deploys only. GitHub rejects a new Pages deployment
    # while another is in flight, and a client-side timeout leaves the previous
    # one wedged -- which is exactly how this site got stuck: one deployment hung
    # for 600s, aborted, and every subsequent attempt was refused with
    #   "due to in progress deployment. Please cancel <sha> first"
    # until it was cancelled by hand.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # A green pipeline must mean the thing readers see is the thing we built.
  # Before this job existed, the site served a 19 July build for three weeks
  # while every check passed.
  verify-published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: Assert the live site serves this exact build
      env:
        PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      run: |
        set -uo pipefail
        base="${PAGE_URL:-https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}}"
        base="${base%/}"
        want="$GITHUB_SHA $GITHUB_RUN_ID"
        echo "checking $base for: $want"
        for attempt in $(seq 1 15); do
          ok=1; last=""
          live=$(curl -sS -L --max-time 30 "$base/build-id.txt?cb=$GITHUB_RUN_ID-$attempt" 2>/dev/null) || live=""
          if [[ "$live" != "$want" ]]; then ok=0; last="build-id is '${live:-<none>}'"; fi
          for p in \
            "chapters/02_lowdim_gglasso/01_data_preparation.html" \
            "chapters/04_highdim_atacama/01_data.html" \
            "chapters/90_reference/01_command_coverage.html"
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$base/$p?cb=$GITHUB_RUN_ID-$attempt" || echo 000)
            [[ "$code" == "200" ]] || { ok=0; last="$code $p"; }
          done
          if [[ "$ok" == "1" ]]; then
            echo "verified: $base is serving $want"
            exit 0
          fi
          echo "attempt $attempt/15: not live yet ($last)"
          sleep 20
        done
        echo "::error::Deployment reported success but $base is not serving this build ($last)."
        exit 1
