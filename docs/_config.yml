# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: High-dimensional Statistics with QIIME 2
author: Biomedical Statistics and Data Science Group @ LMU & Helmholtz Munich

sphinx:
  config:
    copyright: "2026"
    # Generate anchors for h1-h3 so chapters can link to a specific section,
    # e.g. [Numerical methods](#numerical-methods). This is a MyST/Sphinx
    # setting, so it belongs here rather than under the `parse:` key.
    myst_heading_anchors: 3
    bibtex_default_style: "unsrt"  # For numbered citations [1], [2], etc.
    bibtex_bibfiles: ["references.bib"]
    html_theme_options:
      logo:
        image_light: images/logo_light.svg
        image_dark: images/logo_dark.svg

    # The three-tier restructure moved 19 pages. Without these, every existing
    # link into the published book 404s.
    rediraffe_redirects:
      chapters/00_getting_started/02_data: chapters/00_getting_started/02_datasets
      chapters/02_graphical_models/01_data_preparation: chapters/02_lowdim_gglasso/01_data_preparation
      chapters/02_graphical_models/02_sgl: chapters/02_lowdim_gglasso/02_sgl
      chapters/02_graphical_models/03_slr: chapters/02_lowdim_gglasso/03_slr
      chapters/02_graphical_models/04_adaptive_glasso: chapters/02_lowdim_gglasso/04_adaptive_glasso
      chapters/02_graphical_models/05_interpretation: chapters/02_lowdim_gglasso/09_interpretation
      chapters/02_graphical_models/06_highdim_atacama: chapters/04_highdim_atacama/02_model_selection
      chapters/03_logcontrast_models/00_overview: chapters/03_lowdim_classo/00_overview
      chapters/03_logcontrast_models/01_data_preparation: chapters/03_lowdim_classo/02_data_preparation
      chapters/03_logcontrast_models/02_regression/00_index: chapters/03_lowdim_classo/03_regression/00_index
      chapters/03_logcontrast_models/02_regression/01_logcontrast: chapters/03_lowdim_classo/03_regression/01_logcontrast
      chapters/03_logcontrast_models/02_regression/02_trac: chapters/03_lowdim_classo/03_regression/02_trac
      chapters/03_logcontrast_models/03_classification/00_index: chapters/03_lowdim_classo/04_classification/00_index
      chapters/03_logcontrast_models/03_classification/01_logcontrast: chapters/03_lowdim_classo/04_classification/01_logcontrast
      chapters/03_logcontrast_models/03_classification/02_trac: chapters/03_lowdim_classo/04_classification/02_trac
      chapters/03_logcontrast_models/04_advanced/01_concomitant_formulation: chapters/03_lowdim_classo/05_advanced/01_concomitant_formulation
      chapters/03_logcontrast_models/05_interpretation: chapters/03_lowdim_classo/07_interpretation
      chapters/03_logcontrast_models/06_highdim_classo: chapters/04_highdim_atacama/05_classo_cv
      chapters/04_appendix/01_math: chapters/99_appendix/01_math

  extra_extensions:
    - sphinxcontrib.bibtex
    - sphinxext.rediraffe

# Enable LaTeX math ($...$ and $$...$$) in Markdown chapters
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: 'off'

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/Vlasovets/q2-hdstats-docs  
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true